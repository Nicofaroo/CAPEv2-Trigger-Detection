rule:
  meta:
    name: wait for dialog confirmation
    namespace: anti-analysis/anti-sandbox/reverse-turing-test
    authors:
      - nicolas.fabra@unizar.es
    description: |
      Detecta que el programa muestra un cuadro de dialogo y espera la
      interaccion del usuario (MessageBox / DialogBox). Es un indicio del
      mecanismo RTT basado en confirmacion: el malware condiciona su ejecucion
      a que un humano pulse un boton del dialogo. Usado por LummaC2 (2025).
    scopes:
      static: function
      dynamic: call
    att&ck:
      - Defense Evasion::Virtualization/Sandbox Evasion::User Activity Based Checks [T1497.002]
  features:
    - or:
      - api: MessageBox
      - api: MessageBoxA
      - api: MessageBoxW
      - api: MessageBoxEx
      - api: DialogBox
      - api: DialogBoxParam